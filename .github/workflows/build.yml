name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Find project folder
        id: find
        run: |
          F=$(find . -name "settings.gradle*" -not -path "./.git/*" | head -n 1)
          if [ -z "$F" ]; then
            echo "ไม่พบไฟล์ settings.gradle.kts ใน repo นี้ ต้องอัปโหลดไฟล์โปรเจกต์ก่อน"
            ls -R
            exit 1
          fi
          D=$(dirname "$F")
          echo "พบโปรเจกต์ที่: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Thepkub-APK
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
